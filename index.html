<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Báo Giá HM</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110D"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Báo giá HM"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: sidebar + form + live quote paper on desktop; bottom tabs + preview sheet on phone.
   Palette: warm neutrals + brand orange (Hoàng Minh WCAR logo), green only for savings. Type: Barlow Condensed (numbers, headings) + Be Vietnam Pro (text). */
:root{
  --bg:#F7F3EF; --surface:#FFFFFF; --surface-2:#FBF7F3; --ink:#1E1712; --ink-2:#5A4C42; --ink-3:#766759;
  --line:#E8DFD6; --line-2:#D3C6B9;
  --accent:#D9530C; --accent-ink:#FFFFFF; --accent-soft:#FFEADB; --brand-1:#F7941D; --brand-2:#EE6A22;
  --good:#0B8A57; --good-soft:#DDF4E8; --warn:#8F5400; --warn-soft:#FFF0D1; --bad:#B3261E; --bad-soft:#FDE6E4;
  --nav:#17110D; --nav-ink:#F3EBE4; --nav-dim:#B3A396; --nav-on:#2E211A;
  --paper:#FFFFFF; --paper-ink:#1E1712; --paper-muted:#6A5B4F; --paper-line:#E8DFD6; --paper-soft:#FAF3EC;
  --paper-accent:#DA560C; --paper-band:#17110D; --paper-good:#0B8A57;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --tabh:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120F0D; --surface:#1D1815; --surface-2:#251F1B; --ink:#F3ECE6; --ink-2:#BDB0A4; --ink-3:#9A8D81;
    --line:#332B25; --line-2:#4A3F36; --accent:#FF9A45; --accent-ink:#2B1204; --accent-soft:#3A2415;
    --good:#4BD08F; --good-soft:#12301F; --warn:#F0B44C; --warn-soft:#33260C; --bad:#FF8A80; --bad-soft:#3A1A18;
    --nav:#0D0A08; --nav-ink:#F3ECE6; --nav-dim:#9A8D81; --nav-on:#2A201A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120F0D; --surface:#1D1815; --surface-2:#251F1B; --ink:#F3ECE6; --ink-2:#BDB0A4; --ink-3:#9A8D81;
  --line:#332B25; --line-2:#4A3F36; --accent:#FF9A45; --accent-ink:#2B1204; --accent-soft:#3A2415;
  --good:#4BD08F; --good-soft:#12301F; --warn:#F0B44C; --warn-soft:#33260C; --bad:#FF8A80; --bad-soft:#3A1A18;
  --nav:#0D0A08; --nav-ink:#F3ECE6; --nav-dim:#9A8D81; --nav-on:#2A201A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto}
.main{min-width:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--nav);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-brand{display:none}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;
  color:var(--nav-dim);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:#fff;background:var(--nav-on)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.brand-m{display:block;line-height:0}
.brand-m img{height:26px;width:auto;display:block;margin-bottom:4px}
.top h1{white-space:nowrap;font-family:var(--f-disp);font-weight:700;font-size:32px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--good)}.sync.warn i{background:var(--warn)}

/* controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-family:var(--f-disp);font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h h2{margin:0}
.hint{color:var(--ink-2);font-size:13px}
.dim{color:var(--ink-3);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--ink-2)}
input:not([type=checkbox]):not([type=color]):not([type=radio]),select,textarea{width:100%;min-height:44px;padding:9px 12px;
  border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:16px}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{width:44px;height:44px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);flex:none}
.money,.numin{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:480px){.grid2.stack{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{flex:none;width:44px;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:20px;line-height:1;color:var(--ink-2)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.chip{min-height:36px;padding:0 12px;border:1px dashed var(--line-2);border-radius:999px;background:transparent;font-size:13px;color:var(--ink-2)}
.chips-f{display:flex;flex-wrap:wrap;gap:6px}
.chips-f button{min-height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chips-f button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:48px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.o-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.o-sub{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-2);display:inline-block;flex:none}
.sub-h{font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 8px}
.promo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.promo .p-l{grid-column:1/-1}
.p-act{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;padding:0 12px;border:0;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,42%);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow>label,.frow>.lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.frow small{display:block;font-weight:400;color:var(--ink-2);font-size:12px;margin-top:2px}
.inl{display:flex;align-items:center;gap:6px}
.unit{color:var(--ink-2);font-weight:600}
.fcalc{display:flex;justify-content:flex-end;gap:6px;padding:6px 0 2px;font-size:13px;color:var(--ink-2)}
.fcalc b{color:var(--ink);font-variant-numeric:tabular-nums}
.sumline{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-weight:700}
.sumline b{font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;flex:none;margin:0;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
.sw span{font-size:13.5px;font-weight:600}
.sw small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.res div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.res span{display:block;font-size:12px;color:var(--ink-2)}
.res b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.res .wide{grid-column:1/-1}
.res .hl{background:var(--accent-soft);border-color:transparent}
.empty{padding:20px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:500}
.banner a{color:inherit;font-weight:700}

/* summary bar + preview */
.sumbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body:not([data-view="bao-gia"]) .sumbar{display:none}
.sb-k{display:block;font-size:12px;color:var(--ink-2)}
.sumbar b{font-family:var(--f-disp);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.pcol{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pcol.open{display:block}
.pc-in{max-width:560px;margin:0 auto}
.pc-top{display:flex;align-items:center;gap:12px;padding:12px 0}
.pc-top b{font-family:var(--f-disp);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.pc-actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc-actions .primary{grid-column:1/-1}
.pc-paper{padding-bottom:4px}

/* quote paper (always a light sheet, same in both themes) */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line-2);border-radius:6px;overflow:hidden;font-size:13.5px;box-shadow:0 12px 28px -20px rgba(8,14,22,.55)}
.p-band{background:var(--paper-band);color:#fff;padding:16px 20px 14px}
.p-logo{display:block;height:44px;width:auto;margin:0 0 10px}
.p-band::after{content:'';display:block;height:3px;margin:12px -20px -14px;background:linear-gradient(90deg,var(--brand-1,#F7941D),var(--brand-2,#EE6A22))}
.p-dealer{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.p-contact{font-size:12.5px;color:#D9CCC0;margin-top:3px}
.p-body{padding:18px 20px 20px}
.p-title{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1.05}
.p-meta{color:var(--paper-muted);font-size:12.5px;margin-top:4px}
.p-cust{margin-top:12px;font-weight:500}
.p-rule{height:3px;background:var(--paper-accent);margin:14px 0}
.p-car{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1.02}
.p-carsub{color:var(--paper-muted);margin-top:3px}
.p-carimg{text-align:center;margin:6px 0 2px}.p-carimg img{width:78%;max-width:420px;height:auto;display:inline-block}
.p-blk{margin-top:18px}
.p-bt{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-accent);padding-bottom:6px;border-bottom:2px solid var(--paper-ink)}
.p-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--paper-line)}
.p-row .l{min-width:0}
.p-row .v{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.p-row.disc .v{color:var(--paper-good)}
.p-row.strong{background:var(--paper-soft);padding-left:8px;padding-right:8px;font-weight:700}
.p-row.free .v{color:var(--paper-muted);font-weight:500}
.p-row.big{align-items:center}
.p-row.big .v{font-family:var(--f-disp);font-size:28px;color:var(--paper-accent);font-weight:700}
.p-total{margin-top:18px;background:linear-gradient(135deg,#EA7412,#D4500C);color:#fff;border-radius:10px;padding:14px 16px}
.p-total .tl{font-size:12px;font-weight:600;letter-spacing:.05em}
.p-total .tv{font-family:var(--f-disp);font-weight:700;font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.p-total .ts{font-size:12.5px}
.p-note{margin-top:16px;white-space:pre-wrap}
.p-foot{margin-top:16px;font-size:11.5px;color:var(--paper-muted)}
.p-empty{padding:56px 24px;text-align:center;color:var(--paper-muted)}

/* lists */
.toolbar{display:grid;gap:10px;margin-bottom:14px}
.list{display:grid;gap:12px}
.qc{margin:0;display:grid;gap:8px}
.qc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qc-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.qc-sub{color:var(--ink-2);font-size:13px}
.qc-car{font-size:14px;overflow-wrap:anywhere}
.qc-price{font-family:var(--f-disp);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.qc-price small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2);margin-left:6px}
.qc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
select.st{width:auto;min-height:36px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;border:0}
select.st-muted{background:var(--surface-2);color:var(--ink-2)}
select.st-info{background:var(--accent-soft);color:var(--accent)}
select.st-warn{background:var(--warn-soft);color:var(--warn)}
select.st-good{background:var(--good-soft);color:var(--good)}
select.st-off{background:var(--bad-soft);color:var(--bad)}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.c-main{flex:1;min-width:160px}
.c-name{font-weight:700;overflow-wrap:anywhere}
.cat-t{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1.1;text-transform:uppercase}
.cat-b{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.vtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.vtab td{padding:6px 0;border-bottom:1px solid var(--line)}
.vtab td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:700;margin-left:8px;vertical-align:middle}
.erow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.erow>input:first-of-type{flex:1;min-width:0}
.erow .money{flex:0 0 150px;width:150px}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.vp{margin:0 0 12px;padding:6px 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.vp summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);min-height:36px;display:flex;align-items:center}

/* toast + modal */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,13,20,.6);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.m-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:100%;overflow:auto}
.m-card h3{font-family:var(--f-disp);font-size:24px;text-transform:uppercase;margin-bottom:10px}
.m-card img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin-top:10px}
.m-card textarea{min-height:220px}

@media(min-width:1100px){
  body{padding-block:0 40px}
  .app{max-width:1380px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
  .nav{position:sticky;left:auto;right:auto;bottom:auto;top:16px;margin-top:16px;flex-direction:column;gap:4px;padding:18px 12px;border-radius:14px;z-index:1}
  .nav-brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:4px 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--nav-on)}
  .nav-brand img{width:150px;max-width:100%;height:auto;display:block}
  .nav-brand span{font-size:12px;color:var(--nav-dim);letter-spacing:.04em}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:0 12px;min-height:46px}
  .brand-m{display:none}
  .top{padding-top:20px}
  .sumbar{display:none}
  .qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,470px);gap:24px;align-items:start}
  .pcol{position:sticky;inset:auto;top:16px;z-index:1;display:block;background:none;padding:0;overflow:auto;max-height:calc(100vh - 32px)}
  .pc-top{display:none}
  .pc-in{max-width:none}
  .pc-actions{background:var(--bg)}
  .list.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toast{bottom:28px}
}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#auth[hidden]{display:none}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:0 12px 30px -22px rgba(0,0,0,.5)}

async function resolveRole(u){
  const col=n=>FB.collection(FB.db,n),dc=(n,id)=>FB.doc(FB.db,n,id);
  const cache=()=>{try{return JSON.parse(lsGet(roleKey(u))||'null');}catch(e){return null;}};
  const useCache=c=>{ROLE=c.role;PROFILE=c.profile;return c.role;};
  const soft=e=>!e||e.code==='unavailable'||e.code==='timeout'||!navigator.onLine;
  const fail=e=>{const c=cache();if(c&&soft(e))return useCache(c);ERRD=((e&&e.code)||'lỗi')+(e&&e.message?': '+e.message:'');return 'error';};

  let isAdm=false;

  catch(e){if(!e||e.code!=='permission-denied')return fail(e);}
  try{
    if(isAdm){ROLE='admin';let sd=await withTO(FB.getDoc(dc('staff',u.uid)));
      if(!sd.exists()){let pd=null;try{const x=await withTO(FB.getDoc(dc('pending',u.uid)));if(x.exists())pd=x.data();}catch(e){}
        const prof={name:(pd&&pd.name)||REG.name||u.displayName||(u.email||'').split('@')[0],phone:(pd&&pd.phone)||REG.phone||'',email:u.email||'',active:true,createdAt:new Date().toISOString()};
        await withTO(FB.setDoc(dc('staff',u.uid),prof));try{await FB.deleteDoc(dc('pending',u.uid));}catch(e){}PROFILE=prof;}
      else PROFILE=sd.data();
      lsSet(roleKey(u),JSON.stringify({role:'admin',profile:PROFILE}));return 'admin';}
    const sd=await withTO(FB.getDoc(dc('staff',u.uid)));
    if(sd.exists()){if(sd.data().active){ROLE='staff';PROFILE=sd.data();lsSet(roleKey(u),JSON.stringify({role:'staff',profile:PROFILE}));return 'staff';}return 'off';}
    const pr=dc('pending',u.uid),pd=await withTO(FB.getDoc(pr));
    if(!pd.exists())await withTO(FB.setDoc(pr,{name:REG.name||u.displayName||(u.email||'').split('@')[0],phone:REG.phone||'',email:u.email||'',createdAt:new Date().toISOString()}));
    return 'pending';
  }catch(e){return fail(e);}
}

const store={db:null,mode:'pending',mem:{},lis:{},
  async init(){if(CLOUD){this.mode='cloud';return;}let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}this.db=db;this.mode=db?'db':'local';},
  watch(coll,cb){
    if(this.mode==='cloud')return cloudWatch(coll,cb);
    if(this.db){return this.db.collection(coll).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),e=>cb(null,null,e));}
    let o={};try{o=JSON.parse(lsGet('bgia:'+coll)||'{}');}catch(e){}
    if(!lsGet('bgia:seeded:'+coll)){const sd=(window.SEED||{})[coll]||{};Object.keys(sd).forEach(k=>{if(!o[k])o[k]=sd[k];});lsSet('bgia:'+coll,JSON.stringify(o));lsSet('bgia:seeded:'+coll,'1');}
    this.mem[coll]=o;(this.lis[coll]=this.lis[coll]||[]).push(cb);this.fire(coll);return function(){};
  },
  fire(coll){const l=Object.keys(this.mem[coll]).map(id=>Object.assign({id},this.mem[coll][id]));(this.lis[coll]||[]).forEach(f=>f(clone(l),{fromCache:false}));},
  async set(coll,id,data){if(this.mode==='cloud'){await cloudSet(coll,id,data);return;}if(this.db){await this.db.collection(coll).doc(id).set(data);return;}this.mem[coll][id]=clone(data);lsSet('bgia:'+coll,JSON.stringify(this.mem[coll]));this.fire(coll);},
  async del(coll,id){if(this.mode==='cloud'){await cloudDel(coll,id);return;}if(this.db){await this.db.collection(coll).doc(id).delete();return;}delete this.mem[coll][id];lsSet('bgia:'+coll,JSON.stringify(this.mem[coll]));this.fire(coll);}
};

function pendingChanges(){
  const out=[];if(!(CLOUD&&ROLE==='admin'))return out;
  const sh={};S.catalogShared.forEach(r=>{sh[r.id]=r;});const base=mergeSettings(S.settingsShared);
  S.custom.forEach(cu=>{const cc=cu.catalog||{},cs=cu.settings||{};
    Object.keys(cc).forEach(id=>{const e=cc[id],r=sh[id];if(!e)return;if(r?e.b===hsh(cbody(r)):(e.b===null&&e.v))out.push({uid:cu.id,name:cu.ownerName,kind:'cat',id:id,e:e,s:r});});

const mny=n=>dots(+n||0)+' ₫';
const pDisc=x=>(x.promos||[]).filter(p=>p.type==='discount').reduce((a,p)=>a+(+p.amount||0),0);
const pGift=x=>(x.promos||[]).filter(p=>p.type==='gift').length;
function diffCat(a,v){
  if(!a)return ['Xe mới: '+(v.brand||'')+' '+(v.model||'')+' · '+(v.variants||[]).length+' phiên bản'];
  if(!v)return ['Xóa xe khỏi bảng giá'];
  const o=[];if((a.brand||'')!==(v.brand||'')||(a.model||'')!==(v.model||''))o.push('Tên xe: '+a.brand+' '+a.model+' → '+v.brand+' '+v.model);
  if((a.spec||'')!==(v.spec||''))o.push('Thông số: '+(a.spec||'(trống)')+' → '+(v.spec||'(trống)'));
  const am={},vm={};(a.variants||[]).forEach(x=>{am[x.name]=x;});(v.variants||[]).forEach(x=>{vm[x.name]=x;});
  Object.keys(vm).forEach(n=>{const x=am[n],y=vm[n];if(!x){o.push('Thêm phiên bản '+n+' · '+mny(y.price));return;}
    if(+x.price!==+y.price)o.push(n+': giá niêm yết '+mny(x.price)+' → '+mny(y.price));
    if(hsh(x.promos||[])!==hsh(y.promos||[]))o.push(n+': ưu đãi thay đổi (giảm '+mny(pDisc(x))+' → '+mny(pDisc(y))+', quà '+pGift(x)+' → '+pGift(y)+')');});
  Object.keys(am).forEach(n=>{if(!vm[n])o.push('Xóa phiên bản '+n);});
  if(hsh(a.colors||[])!==hsh(v.colors||[]))o.push('Màu sắc thay đổi');
  return o.length?o:['Thay đổi khác'];
}
const fmtV=x=>typeof x==='number'?dots(x):(x===''||x==null?'(trống)':String(x));
function diffSet(k,a,b){
  if(k==='provinces'){const am={},bm={},o=[];(a||[]).forEach(x=>{am[x.name]=x.fee;});(b||[]).forEach(x=>{bm[x.name]=x.fee;});
    Object.keys(bm).forEach(n=>{if(!(n in am))o.push('Thêm '+n+': '+mny(bm[n]));else if(+am[n]!==+bm[n])o.push(n+': '+mny(am[n])+' → '+mny(bm[n]));});
    Object.keys(am).forEach(n=>{if(!(n in bm))o.push('Bỏ '+n);});return o.length?o:['Thay đổi khác'];}
  if(a&&b&&typeof a==='object'){const o=[];Object.keys(Object.assign({},a,b)).forEach(x=>{if(hsh(a[x])!==hsh(b[x]))o.push((FLAB[x]||x)+': '+fmtV(a[x])+' → '+fmtV(b[x]));});return o.length?o:['Thay đổi khác'];}
  return [fmtV(a)+' → '+fmtV(b)];
}

}

/* ---------- calculation ---------- */
function calc(q){
  const list=Math.max(0,(+q.variantPrice||0)+(+q.colorExtra||0));
  const discounts=q.promos.filter(p=>p.type==='discount').reduce((a,p)=>a+(+p.amount||0),0);
  const net=Math.max(0,list-discounts);
  const reg=Math.round(list*(+q.regRate||0)/100);
  const bhvc=q.bhvcOn?Math.round(list*(+q.bhvcRate||0)/100):0;
  const other=q.otherFees.reduce((a,f)=>a+(+f.amount||0),0);
  const fees=reg+(+q.plate||0)+(+q.inspection||0)+(+q.road||0)+(+q.tnds||0)+(+q.service||0)+(+q.mica||0)+bhvc+other;
  let loan=null;
  if(q.loanOn){
    const down=Math.round(list*(+q.downPct||0)/100),P=Math.max(0,net-down),n=Math.max(1,Math.round((+q.years||0)*12)),r=(+q.rate||0)/100/12;
    let first,last,interest;
    if(q.method==='deu'){const pmt=r===0?P/n:P*r/(1-Math.pow(1+r,-n));first=last=pmt;interest=pmt*n-P;}
    else{first=P/n+P*r;last=P/n+(P/n)*r;interest=P*r*(n+1)/2;}
    loan={down,P,n,first,last,interest,upfront:down+fees};
  }
  return {list,discounts,net,reg,bhvc,other,fees,rolling:net+fees,loan};
}
const hasCar=q=>!!(q.carName&&q.variantPrice>0);

function buildDoc(q,c){
  if(!hasCar(q))return {empty:true};
  const st=S.settings,base=q.createdAt?new Date(q.createdAt):new Date(),valid=new Date(base.getTime()+(+q.validDays||0)*86400000);
  const contact=[];const sp=[st.seller,st.phone].filter(Boolean).join(' · ');if(sp)contact.push(sp);if(st.address)contact.push(st.address);
  const sub=[q.variantName,q.colorName?'Màu '+q.colorName:''].filter(Boolean).join(' · ');
  const r1=[{l:'Giá niêm yết',v:money(q.variantPrice)}];
  if(q.colorExtra>0)r1.push({l:'Phụ thu màu '+(q.colorName||''),v:money(q.colorExtra)});
  q.promos.filter(p=>p.type==='discount'&&p.amount>0).forEach(p=>r1.push({l:p.label||'Ưu đãi',v:'− '+money(p.amount),k:'disc'}));
  if(c.discounts>0||q.colorExtra>0)r1.push({l:'Giá xe sau ưu đãi',v:money(c.net),k:'strong'});
  const r2=[{l:'Lệ phí trước bạ'+(q.regRate>0?' ('+pct(q.regRate)+'%)':''),v:c.reg>0?money(c.reg):'Miễn',k:c.reg>0?'':'free'}];
  const add=(l,v)=>{if(v>0)r2.push({l,v:money(v)});};
  add('Phí đăng ký biển số',+q.plate);add('Phí đăng kiểm',+q.inspection);add('Phí sử dụng đường bộ (1 năm)',+q.road);add('Bảo hiểm TNDS bắt buộc',+q.tnds);add('Phí dịch vụ đăng ký xe'+(q.province?' ('+q.province+')':''),+q.service);add('Ép biển số mica',+q.mica);
  if(q.bhvcOn)add('Bảo hiểm thân vỏ ('+pct(q.bhvcRate)+'% giá niêm yết)',c.bhvc);
  q.otherFees.forEach(f=>add(f.label||'Chi phí khác',+f.amount));
  const blocks1=[{title:'Giá xe',rows:r1},{title:'Chi phí lăn bánh',rows:r2}];
  const blocks2=[];
  const gifts=q.promos.filter(p=>p.type==='gift'&&p.label);
  if(gifts.length)blocks2.push({title:'Quà tặng kèm',rows:gifts.map(p=>({l:p.label,v:p.amount>0?'Trị giá '+money(p.amount):''}))});
  if(c.loan){const L=c.loan,rows=[
    {l:'Trả trước ('+pct(q.downPct)+'%)',v:money(L.down)},{l:'Số tiền vay',v:money(L.P)},
    {l:'Thời hạn · lãi suất',v:q.years+' năm · '+pct(q.rate)+'%/năm'},{l:'Hình thức',v:METHODS[q.method]||''}];
    if(q.method==='deu')rows.push({l:'Trả hàng tháng',v:money(L.first),k:'big'});
    else{rows.push({l:'Trả tháng đầu',v:money(L.first),k:'big'});rows.push({l:'Trả tháng cuối',v:money(L.last)});}
    rows.push({l:'Tổng lãi dự kiến',v:money(L.interest)});
    rows.push({l:'Cần chuẩn bị ban đầu (trả trước + chi phí lăn bánh)',v:money(L.upfront),k:'strong'});
    blocks2.push({title:'Phương án trả góp',rows});}
  const wCar=catById(q.catalogId),wBrand=wCar?wCar.brand:String(q.carName||'').split(' ')[0];
  const wl=String(warrantyFor(st,wBrand)).split('\n').map(s=>s.trim()).filter(Boolean);
  if(wl.length)blocks2.push({title:'Bảo hành',rows:wl.map(l=>({l,v:''}))});
  return {empty:false,dealer:/^CÔNG TY TNHH BÁN XE NĂNG LƯỢNG MỚI\s*-\s*HOÀNG MINH WCAR$/i.test(String(st.dealer||'').trim())?'Công ty thuộc tập đoàn Hoàng Minh':st.dealer,contact,date:fmtDate(base),valid:fmtDate(valid),customer:q.customerName.trim(),customerPhone:q.customerPhone.trim(),
    car:{title:q.carName,sub,spec:q.carSpec||'',img:carImgSrc(q.carName,q.variantName)},blocks1,total:{l:'TỔNG GIÁ LĂN BÁNH DỰ KIẾN',v:money(c.rolling),sub:'≈ '+shortM(c.rolling)+' đồng'},blocks2,note:(q.note||'').trim(),footer:st.footer};
}

  const band='<div class="p-band"><img class="p-logo" src="'+LOGO_URL+'" alt="Hoàng Minh WCAR">'+(d.dealer?'<div class="p-dealer">'+esc(d.dealer)+'</div>':'')+d.contact.map(l=>'<div class="p-contact">'+esc(l)+'</div>').join('')+'</div>';

    +'<div class="p-total"><div class="tl">'+esc(d.total.l)+'</div><div class="tv">'+esc(d.total.v)+'</div><div class="ts">'+esc(d.total.sub)+'</div></div>'
    +d.blocks2.map(blk).join('')
    +(d.note?'<div class="p-note">'+esc(d.note)+'</div>':'')+'<div class="p-foot">'+esc(d.footer)+'</div></div>';
}
function docText(d){
  const L=[];if(d.dealer)L.push(d.dealer.toUpperCase());L.push('BẢNG BÁO GIÁ XE ĐIỆN');L.push('Ngày '+d.date+' · hiệu lực đến '+d.valid);
  if(d.customer)L.push('Kính gửi: '+d.customer);L.push('');L.push(d.car.title+(d.car.sub?' – '+d.car.sub:''));if(d.car.spec)L.push(d.car.spec);
  const blk=b=>{L.push('');L.push(b.title.toUpperCase());b.rows.forEach(r=>L.push(r.v?'- '+r.l+': '+r.v:'- '+r.l));};
  d.blocks1.forEach(blk);L.push('');L.push(d.total.l+': '+d.total.v+' ('+d.total.sub+')');d.blocks2.forEach(blk);
  if(d.note){L.push('');L.push(d.note);}L.push('');if(d.contact.length)L.push('Liên hệ: '+d.contact.join(' · '));L.push(d.footer);return L.join('\n');
}

try{const bin=atob(LOGO_B64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);LOGO_URL=URL.createObjectURL(new Blob([u8],{type:'image/png'}));}catch(e){}
const LOGO_IMG=new Image();LOGO_IMG.src=LOGO_URL;
/* ảnh xe: thêm dòng mới = thêm 1 file vào thư mục images/ và 1 dòng ở đây (k = từ khoá trong tên xe, viết thường không dấu) */
const CAR_IMGS=[{k:'xiaoma',v:'170',src:'images/xiaoma.webp'},{k:'xiaoma',src:'images/xiaoma-bac-xiu.webp'},{k:'bingo',v:'base',src:'images/bingo.webp'},{k:'bingo',v:'plus',src:'images/bingo.webp'},{k:'bingo',v:'max',src:'images/bingo-max.webp'},{k:'darion',src:'images/darion.webp'},{k:'grango',src:'images/grango.webp'},{k:'macaron',v:'205',src:'images/macaron-205.webp'},{k:'macaron',v:'305',src:'images/macaron-305.webp'}];
const CAR_IMG_CACHE={};
function carImgSrc(name,variant){const nm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();const n=nm(name),v=nm(variant);const f=CAR_IMGS.find(x=>n.indexOf(x.k)>=0&&(!x.v||v.indexOf(x.v)>=0));return f?f.src:'';}
function carImgObj(src){if(!src)return null;if(!CAR_IMG_CACHE[src]){const i=new Image();i.src=src;CAR_IMG_CACHE[src]=i;}return CAR_IMG_CACHE[src];}
document.querySelectorAll('img[data-logo]').forEach(i=>{i.src=LOGO_URL;});

/* ---------- canvas image of the quote ---------- */
function drawQuote(d,ctx,W,draw){
  const M=56,IW=W-M*2,INK='#1E1712',MUT='#6A5B4F',LINE='#E8DFD6',ACC='#DA560C',GOOD='#0B8A57',SOFT='#FAF3EC';
  const body=(w,s)=>w+' '+s+'px "Be Vietnam Pro", system-ui, sans-serif';
  const disp=(w,s)=>w+' '+s+'px "Barlow Condensed", "Be Vietnam Pro", sans-serif';
  const T=(s,x,y,font,col,al)=>{if(!draw)return;ctx.font=font;ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);};
  const R=(x,y,w,h,col,r)=>{if(!draw)return;ctx.fillStyle=col;if(r&&ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}else ctx.fillRect(x,y,w,h);};
  const wrap=(s,font,mw)=>{ctx.font=font;const out=[];String(s).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>mw&&line){out.push(line);line=w;}else line=t;});out.push(line);});return out;};
  let y=0;
  {
    const LH=84,LW=Math.round(LH*(LOGO_IMG.naturalWidth||640)/(LOGO_IMG.naturalHeight||168));
    const dl=d.dealer?wrap(d.dealer.toUpperCase(),disp(700,38),IW):[];
    const bh=40+LH+(dl.length?18+dl.length*46:0)+(d.contact.length?10+d.contact.length*36:0)+34;
    R(0,0,W,bh,'#17110D');
    if(draw){if(LOGO_IMG.complete&&LOGO_IMG.naturalWidth)ctx.drawImage(LOGO_IMG,M,40,LW,LH);else T('HOÀNG MINH WCAR',M,40+LH*0.7,disp(700,60),'#F7941D');
      const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#F7941D');g.addColorStop(1,'#EE6A22');ctx.fillStyle=g;ctx.fillRect(0,bh-8,W,8);}
    let by=40+LH;
    dl.forEach((l,i)=>{by+=(i===0?18:0)+46;T(l,M,by-8,disp(700,38),'#FFFFFF');});
    d.contact.forEach((l,i)=>{by+=(i===0?10:0)+36;T(l,M,by-6,body(400,24),'#D9CCC0');});
    y=bh;
  }
  y+=46;T('BẢNG BÁO GIÁ XE ĐIỆN',M,y+50,disp(700,64),INK);y+=50;
  T('Ngày '+d.date+' · Hiệu lực đến '+d.valid,M,y+40,body(400,24),MUT);y+=40;
  if(d.customer){y+=14;wrap('Kính gửi: '+d.customer+(d.customerPhone?' · '+d.customerPhone:''),body(500,26),IW).forEach(l=>{y+=38;T(l,M,y,body(500,26),INK);});}
  y+=26;R(M,y,IW,4,ACC);y+=34;
  wrap(d.car.title,disp(700,76),IW).forEach(l=>{y+=68;T(l,M,y,disp(700,76),INK);});
  const sub=[d.car.sub,d.car.spec].filter(Boolean).join('\n');
  if(sub)wrap(sub,body(400,26),IW).forEach(l=>{y+=38;T(l,M,y,body(400,26),MUT);});
  {const im=carImgObj(d.car.img);if(im&&im.complete&&im.naturalWidth){const iw=Math.round(IW*0.74),ih=Math.round(iw*im.naturalHeight/im.naturalWidth);y+=18;if(draw)ctx.drawImage(im,M+Math.round((IW-iw)/2),y,iw,ih);y+=ih;}}
  y+=34;
  const block=b=>{
    T(b.title.toUpperCase(),M,y+24,body(700,22),ACC);y+=24+14;R(M,y,IW,3,INK);y+=3;
    b.rows.forEach(r=>{
      const strong=r.k==='strong'||r.k==='big',big=r.k==='big';
      const lf=body(strong?700:400,27),lines=wrap(r.l,lf,IW*0.6),rh=Math.max(lines.length*36+22,big?78:0),pad=r.k==='strong'?16:0;
      if(r.k==='strong')R(M,y,IW,rh,SOFT);
      lines.forEach((l,i)=>T(l,M+pad,y+(big?(rh/2+9):(11+28+i*36)),lf,INK));
      const vcol=r.k==='disc'?GOOD:r.k==='free'?MUT:big?ACC:INK;
      T(r.v,M+IW-pad,y+(big?(rh/2+14):(11+28)),big?disp(700,52):body(strong?700:600,27),vcol,'right');
      R(M,y+rh-1,IW,1,LINE);y+=rh;
    });
    y+=32;
  };
  d.blocks1.forEach(block);
  let tg='#E2630F';if(draw){tg=ctx.createLinearGradient(M,y,M+IW,y+176);tg.addColorStop(0,'#EA7412');tg.addColorStop(1,'#D4500C');}
  R(M,y,IW,176,tg,18);T(d.total.l,M+36,y+52,body(600,24),'#FFE9D6');T(d.total.v,M+36,y+128,disp(700,92),'#FFFFFF');T(d.total.sub,M+IW-36,y+154,body(500,24),'#FFE9D6','right');y+=176+36;
  d.blocks2.forEach(block);
  if(d.note){T('GHI CHÚ',M,y+24,body(700,22),ACC);y+=24+14;R(M,y,IW,3,INK);y+=3;wrap(d.note,body(400,26),IW).forEach(l=>{y+=38;T(l,M,y,body(400,26),INK);});y+=34;}
  wrap(d.footer,body(400,21),IW).forEach(l=>{y+=30;T(l,M,y,body(400,21),MUT);});
  return y+52;
}
async function loadFonts(){try{await Promise.all([['400','Be Vietnam Pro'],['500','Be Vietnam Pro'],['600','Be Vietnam Pro'],['700','Be Vietnam Pro'],['700','Barlow Condensed']].map(f=>document.fonts.load(f[0]+' 24px "'+f[1]+'"','Ăâđêôơư ấầẩẫậ 0123456789')));}catch(e){}}
async function makeCanvas(){
  const c=calc(Q),d=buildDoc(Q,c);if(d.empty){toast('Chọn xe trước khi xuất báo giá');return null;}
  await loadFonts();try{await LOGO_IMG.decode();}catch(e){}{const ci=carImgObj(d.car.img);if(ci){try{await ci.decode();}catch(e){}}}const W=1080,m=document.createElement('canvas').getContext('2d');
  const H=Math.ceil(drawQuote(d,m,W,false));const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);drawQuote(d,ctx,W,true);return {cv,d};
}
const fileName=ext=>'BaoGia_'+(slug(Q.customerName)||'Khach')+'_'+(slug(Q.carName)||'Xe')+'_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.'+ext;
async function getDL(){if(DL)return DL;try{DL=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){DL=null;}return DL;}
async function saveFile(filename,blob){const dl=await getDL();if(!dl){
    try{const file=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast('Đã tải file');return;}
  try{await dl.save({filename,data:blob});toast('Đã lưu file');}catch(e){if(e&&e.code!=='declined')toast('Không lưu được file');}}

let draftT=null;
function touch(){Q._dirty=true;if(CLOUD&&ME)Q._owner=ME.uid;clearTimeout(draftT);draftT=setTimeout(()=>lsSet('bgia:draft',JSON.stringify(Q)),600);}
function applyPromos(v){if(!v)return;if(!Q.promos.length||Q.promosAuto){Q.promos=clone(v.promos||[]);Q.promosAuto=true;}}
function selectModel(id){const car=catById(id);if(!car)return;Q.catalogId=id;Q.carName=(car.brand+' '+car.model).trim();Q.carSpec=car.spec||'';
  const v=car.variants[0];Q.variantName=v?v.name:'';Q.variantPrice=v?v.price:0;const co=car.colors[0];Q.colorName=co?co.name:'';Q.colorExtra=co?(co.extra||0):0;applyPromos(v);}

/* ---------- save / load quotes ---------- */
async function saveQuote(){
  if(!hasCar(Q)){toast('Chọn xe trước khi lưu');return;}
  const c=calc(Q),now=new Date().toISOString(),name=Q.customerName.trim(),phone=Q.customerPhone.trim();
  let cid=Q.customerId;
  if(name||phone){
    const pd=digits(phone);
    const mineC=CLOUD?S.customers.filter(x=>x.ownerId===ME.uid):S.customers;let cu=(cid&&S.customers.find(x=>x.id===cid))||(pd&&mineC.find(x=>digits(x.phone)===pd))||null;
    if(cu){cid=cu.id;if((!cu.phone&&phone)||(!cu.name&&name)){const b=body(cu);b.name=cu.name||name;b.phone=cu.phone||phone;await put('customers',cid,b);}}
    else{cid=uid('c_');if(!await put('customers',cid,{name:name||'Khách chưa đặt tên',phone,note:'',createdAt:now}))return;}
  }
  const id=Q.id||uid('q_'),rec=clone(Q);delete rec.id;delete rec._dirty;delete rec._owner;
  Object.assign(rec,{customerId:cid||null,rolling:c.rolling,net:c.net,monthly:c.loan?c.loan.first:0,createdAt:Q.createdAt||now,updatedAt:now});
  if(!await put('quotes',id,rec))return;
  Q.id=id;Q.createdAt=rec.createdAt;Q.customerId=cid||null;lsSet('bgia:draft',JSON.stringify(Q));refresh();toast(rec.updatedAt===rec.createdAt?'Đã lưu báo giá':'Đã cập nhật báo giá');
}
function loadQuote(r,asCopy){
  const b=clone(r);Q=Object.assign(newQuote(),b,{id:asCopy?null:r.id,_dirty:true});if(b.province===undefined)Q.province='';
  if(asCopy){Q.createdAt=null;Q.status='moi';}
  Q.promosAuto=false;
  Q.promos=Q.promos||[];Q.otherFees=Q.otherFees||[];
  if(location.hash!=='#bao-gia')location.hash='#bao-gia';else setView('bao-gia');
  fullRender();lsSet('bgia:draft',JSON.stringify(Q));
}
function startQuoteFor(cu){Q=newQuote();Q.customerId=cu.id;Q.customerName=cu.name;Q.customerPhone=cu.phone||'';ensureSelection();lsDel('bgia:draft');
  if(location.hash!=='#bao-gia')location.hash='#bao-gia';else setView('bao-gia');fullRender();}

function readVal(t){
  const k=t.dataset.t;
  if(k==='money'){const pos=t.selectionStart,before=t.value.slice(0,pos).replace(/\D/g,'').length,dg=digits(t.value);
    t.value=dg?dots(parseInt(dg,10)):'';let c=0,i=0;if(before>0){for(;i<t.value.length;i++){if(/\d/.test(t.value[i]))c++;if(c===before){i++;break;}}}
    try{t.setSelectionRange(i,i);}catch(e){}return dg?parseInt(dg,10):0;}
  if(k==='num')return num(t.value);if(k==='bool')return t.checked;return t.value;
}

    $('#m-img').src=r.cv.toDataURL('image/png');},
  'save-png'(){if(!MODAL.cv)return;MODAL.cv.toBlob(b=>{if(b)saveFile(fileName('png'),b);},'image/png');},
  async 'export-pdf'(){
    if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Chưa tải được công cụ tạo PDF, hãy dùng Ảnh gửi Zalo');return;}
    const r=await makeCanvas();if(!r)return;const cv=r.cv,pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),pw=210,ph=297,mg=8,aw=pw-2*mg,ah=ph-2*mg;
    let w=aw,h=aw*cv.height/cv.width;if(h>ah){h=ah;w=ah*cv.width/cv.height;}
    pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(pw-w)/2,mg,w,h);saveFile(fileName('pdf'),pdf.output('blob'));},
  'copy-text'(){const d=buildDoc(Q,calc(Q));if(d.empty){toast('Chọn xe trước khi sao chép');return;}copyText(docText(d));},
  'copy'(el){copyText(el.dataset.copy);},
  'close-modal'(){closeModal();},
  'h-filter'(el){H.st=el.dataset.st;renderHistory();},
  'open-q'(el){const r=S.quotes.find(x=>x.id===el.dataset.id);if(r)loadQuote(r,false);},
  'dup-q'(el){const r=S.quotes.find(x=>x.id===el.dataset.id);if(r){loadQuote(r,true);toast('Đã nhân bản, chỉnh rồi lưu thành báo giá mới');}},
  'del-q'(el){arm(el,'Bấm lần nữa để xóa',async()=>{if(await remove('quotes',el.dataset.id)&&Q.id===el.dataset.id){Q.id=null;Q.createdAt=null;refresh();}});},
  'cust-new'(){custModal(null);},
  'cust-edit'(el){custModal(S.customers.find(x=>x.id===el.dataset.id));},
  'cust-save'(){const name=$('#cm-name').value.trim();if(!name){toast('Nhập tên khách');return;}
    const old=MODAL.id?S.customers.find(x=>x.id===MODAL.id):null;
    put('customers',MODAL.id||uid('c_'),{name,phone:$('#cm-phone').value.trim(),note:$('#cm-note').value.trim(),createdAt:old?old.createdAt:new Date().toISOString()}).then(ok=>{if(ok){closeModal();toast('Đã lưu khách');}});},
  'cust-del'(el){arm(el,'Bấm lần nữa để xóa',()=>remove('customers',el.dataset.id));},
  'cust-quote'(el){const c=S.customers.find(x=>x.id===el.dataset.id);if(c)startQuoteFor(c);},
  'cat-new'(){CE={id:'new',open:{},draft:{brand:'',model:'',spec:'',variants:[{name:'',price:0,promos:[]}],colors:[]}};renderCatalog();window.scrollTo(0,0);},
  'cat-edit'(el){const m=catById(el.dataset.id);if(!m)return;CE={id:m.id,open:{},draft:clone(m)};renderCatalog();},
  'ce-add'(el){const a=CE.draft[el.dataset.arr];a.push(el.dataset.arr==='variants'?{name:'',price:0,promos:[]}:{name:'',hex:'#cccccc',extra:0});renderCatalog();},
  'ce-rm'(el){CE.draft[el.dataset.arr].splice(+el.dataset.i,1);renderCatalog();},
  'ce-cancel'(){CE=null;renderCatalog();},
  'ex-quotes'(){if(!CLOUD||ROLE!=='admin')return;const rows=pickOwner(S.quotes,exportOwner()).slice().sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).map(r=>[fmtDT(r.createdAt),ownerLabel(r),r.customerName,r.customerPhone,r.carName,r.variantName,r.colorName,r.variantPrice,r.net,r.rolling,r.monthly,(STATUS[r.status]||[r.status])[0],r.note]);
    if(!rows.length){toast('Chưa có báo giá nào để xuất');return;}
    saveFile('BaoGia_TrichLuc_'+stamp()+'.csv',csvBlob(['Ngày tạo','Nhân viên','Khách hàng','SĐT','Xe','Phiên bản','Màu','Giá niêm yết','Giá sau ưu đãi','Giá lăn bánh','Trả góp tháng đầu','Trạng thái','Ghi chú'],rows));},
  'ex-customers'(){if(!CLOUD||ROLE!=='admin')return;const rows=pickOwner(S.customers,exportOwner()).slice().sort((x,y)=>String(x.name).localeCompare(String(y.name),'vi')).map(r=>[r.name,r.phone,r.note,ownerLabel(r),fmtDT(r.createdAt)]);
    if(!rows.length){toast('Chưa có khách nào để xuất');return;}
    saveFile('KhachHang_TrichLuc_'+stamp()+'.csv',csvBlob(['Tên khách','SĐT','Ghi chú','Nhân viên','Ngày tạo'],rows));},
  'ex-all'(){if(!CLOUD||ROLE!=='admin')return;const o=exportOwner(),cat={};S.catalog.forEach(c=>{const b=body(c);cat[c.id]=b;});
    const pack=arr=>{const m={};pickOwner(arr,o).forEach(r=>{m[r.id]=body(r);});return m;};
    saveFile('SaoLuu_BaoGia_'+stamp()+'.json',new Blob([JSON.stringify({app:'bao-gia-hm',version:1,at:new Date().toISOString(),data:{catalog:cat,customers:pack(S.customers),quotes:pack(S.quotes),settings:{main:body(Object.assign({id:'main'},S.settings))}}})],{type:'application/json'}));},
  'bk-export'(){if(CLOUD)return;const o={app:'bao-gia-hm',version:1,at:new Date().toISOString(),data:{}};['catalog','customers','quotes','settings'].forEach(c=>{try{o.data[c]=JSON.parse(lsGet('bgia:'+c)||'{}');}catch(e){o.data[c]={};}});saveFile('SaoLuu_BaoGia_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(o)],{type:'application/json'}));},
  'bk-import'(){if(CLOUD)return;const f=$('#bk-file');if(f)f.click();},
  async 'seed'(){if(CLOUD&&ROLE!=='admin'){toast('Chỉ admin được nạp bảng giá mẫu');return;}const sd=SEED_DATA;for(const id of Object.keys(sd.catalog)){if(!await put('catalog',id,sd.catalog[id]))return;}if(!S.settingsExists&&!await put('settings','main',sd.settings.main))return;toast('Đã nạp bảng giá xe cho cả đội');},
  'seed-ask'(el){arm(el,'Bấm lần nữa để nạp lại (ghi đè xe cùng tên)',()=>ACT.seed());},
  async 'logout'(){try{await FB.signOut(FB.auth);}catch(e){}lsDel('bgia:draft');location.reload();},
  async 'st-approve'(el){const pd=S.pending.find(x=>x.id===el.dataset.id);if(!pd)return;try{await FB.setDoc(FB.doc(FB.db,'staff',pd.id),{name:pd.name||'',phone:pd.phone||'',email:pd.email||'',active:true,approvedAt:new Date().toISOString()});await FB.deleteDoc(FB.doc(FB.db,'pending',pd.id));toast('Đã duyệt '+(pd.name||pd.email));}catch(e){toast('Không duyệt được, hãy thử lại');}},
  'st-reject'(el){arm(el,'Bấm lần nữa để từ chối',async()=>{try{await FB.deleteDoc(FB.doc(FB.db,'pending',el.dataset.id));toast('Đã từ chối');}catch(e){toast('Không thực hiện được');}});},
  async 'st-toggle'(el){const u=S.staff.find(x=>x.id===el.dataset.id);if(!u||u.id===ME.uid)return;try{await FB.setDoc(FB.doc(FB.db,'staff',u.id),Object.assign({},body(u),{active:!u.active}));toast(u.active?'Đã tắt tài khoản':'Đã bật lại tài khoản');}catch(e){toast('Không thực hiện được');}},
  'st-view'(el){OWNER=el.dataset.id;renderOwnerFilters();renderHistory();renderCustomers();location.hash='#lich-su';},
  'prov-add'(){S.settings.provinces=S.settings.provinces||[];S.settings.provinces.push({name:'',fee:0});renderSettings();queueSettingsSave();},
  'prov-rm'(el){S.settings.provinces.splice(+el.dataset.i,1);renderSettings();queueSettingsSave();},
  'cevp-add'(el){const v=CE.draft.variants[+el.dataset.i];v.promos=v.promos||[];v.promos.push({label:'',amount:0,type:el.dataset.t});CE.open=CE.open||{};CE.open[el.dataset.i]=true;renderCatalog();},
  'cevp-rm'(el){CE.draft.variants[+el.dataset.i].promos.splice(+el.dataset.k,1);CE.open=CE.open||{};CE.open[el.dataset.i]=true;renderCatalog();},
  'cevp-type'(el){CE.draft.variants[+el.dataset.i].promos[+el.dataset.k].type=el.dataset.t;CE.open=CE.open||{};CE.open[el.dataset.i]=true;renderCatalog();},
  'cevp-copy'(el){const i=+el.dataset.i;CE.draft.variants[i].promos=clone(CE.draft.variants[i-1].promos||[]);CE.open=CE.open||{};CE.open[i]=true;renderCatalog();},
  async 'ce-save'(){const d=CE.draft;d.brand=d.brand.trim();d.model=d.model.trim();
    d.variants=d.variants.filter(v=>v.name.trim()&&v.price>0);d.colors=d.colors.filter(c=>c.name.trim());
    if(!d.model){toast('Nhập tên dòng xe');return;}if(!d.variants.length){toast('Thêm ít nhất một phiên bản có giá');return;}
    d.variants.forEach(v=>{v.promos=(v.promos||[]).filter(p=>p.label.trim()||p.amount>0);});
    const id=CE.id==='new'?uid('m_'):CE.id,rec=clone(d);rec.sample=false;if(await saveCat(id,rec)){CE=null;renderCatalog();toast(isStaffRole()?'Đã lưu riêng cho bạn, admin sẽ nhận được thay đổi':'Đã lưu xe');}},
  'cat-revert'(el){arm(el,'Bấm lần nữa để bỏ chỉnh sửa riêng',async()=>{if(await revertCat(el.dataset.id))toast('Đã quay về bảng chung');});},
  'cust-reset'(el){arm(el,'Bấm lần nữa để khôi phục toàn bộ',async()=>{if(await revertAll())toast('Đã quay về bảng chung');});},
  async 'ch-apply'(el){const ch=pendingChanges().find(x=>x.uid===el.dataset.u&&x.kind===el.dataset.kind&&x.id===el.dataset.id);if(!ch)return;let ok;
    if(ch.kind==='cat')ok=ch.e.v?await put('catalog',ch.id,Object.assign(clone(ch.e.v),{sample:false})):await remove('catalog',ch.id);
    else{const cur=mergeSettings(S.settingsShared);cur[ch.id]=clone(ch.e.v);delete cur.id;delete cur.seller;delete cur.phone;ok=await put('settings','main',cur);}
    if(ok){await dropChange(ch);toast('Đã áp dụng cho cả đội');}},
  'ch-drop'(el){arm(el,'Bấm lần nữa để từ chối',async()=>{const ch=pendingChanges().find(x=>x.uid===el.dataset.u&&x.kind===el.dataset.kind&&x.id===el.dataset.id);if(!ch)return;await dropChange(ch);toast('Đã từ chối, nhân viên quay về bảng chung');});},
  'ce-del'(el){arm(el,'Bấm lần nữa để xóa xe',async()=>{if(await removeCat(CE.id)){CE=null;renderCatalog();}});}
};
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('Đã sao chép');}
  catch(e){openModal('<h3>Sao chép nội dung</h3><p class="hint">Chọn toàn bộ chữ bên dưới rồi sao chép.</p><textarea id="m-copy" readonly></textarea><div class="m-actions"><button type="button" class="btn" data-act="close-modal">Đóng</button></div>');
    const ta=$('#m-copy');ta.value=txt;ta.focus();ta.select();}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||/SELECT|INPUT|TEXTAREA/.test(el.tagName))return;
  const f=ACT[el.dataset.act];if(f)f(el);
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='model'){selectModel(t.value);touch();fullRender();}
  else if(a==='zone'){Q.plateZone=t.value;Q.plate=ZONES[t.value].fee;touch();renderQuoteForm();refresh();}
  else if(a==='method'){Q.method=t.value;touch();refresh();}
  else if(a==='prov'){Q.province=t.value;if(t.value)Q.service=provFee(t.value,Q.service);touch();renderQuoteForm();refresh();}
  else if(a==='s-prov'){S.settings.province=t.value;queueSettingsSave();}
  else if(a==='status'){const r=S.quotes.find(x=>x.id===t.dataset.id);if(r){const b=body(r);b.status=t.value;b.updatedAt=new Date().toISOString();put('quotes',r.id,b);if(Q.id===r.id)Q.status=t.value;}}
  else if(a==='s-zone'){S.settings.fees.plateZone=t.value;S.settings.fees.plate=ZONES[t.value].fee;renderSettings();queueSettingsSave();}
  else if(a==='s-method'){S.settings.loan.method=t.value;queueSettingsSave();}
  else if(t.dataset&&t.dataset.q&&t.type==='checkbox'){Q[t.dataset.q]=t.checked;touch();if(t.dataset.re){renderQuoteForm();}refresh();}
  else if(t.id==='q-name'){const nm=t.value.trim().toLowerCase(),cu=S.customers.find(c=>c.name.trim().toLowerCase()===nm);
    if(cu){Q.customerId=cu.id;if(!Q.customerPhone&&cu.phone){Q.customerPhone=cu.phone;$('#q-phone').value=cu.phone;}touch();refresh();}}
});
$('#qform').addEventListener('input',e=>{
  const t=e.target,d=t.dataset;if(!d||t.type==='checkbox')return;
  if(d.q){Q[d.q]=readVal(t);if(d.q==='customerName'||d.q==='customerPhone')Q.customerId=null;
    if(d.q==='service'){Q.province='';const ps=$('#q-prov');if(ps)ps.value='';}touch();refresh();}
  else if(d.arr){const o=Q[d.arr][+d.i];if(o){o[d.f]=readVal(t);if(d.arr==='promos')Q.promosAuto=false;touch();refresh();}}
});
$('#cat-list').addEventListener('input',e=>{
  const t=e.target,d=t.dataset;if(!CE||!d)return;
  if(d.ce)CE.draft[d.ce]=t.value;
  else if(d.cearr){const o=CE.draft[d.cearr][+d.i];if(o)o[d.f]=d.t==='money'?readVal(t):t.value;}
  else if(d.cevp){const p=CE.draft.variants[+d.i].promos[+d.k];if(p)p[d.f]=d.f==='amount'?readVal(t):t.value;}
});
$('#cat-list').addEventListener('toggle',e=>{const d=e.target;if(CE&&d&&d.dataset&&d.dataset.vi!==undefined){CE.open=CE.open||{};CE.open[d.dataset.vi]=d.open;}},true);
$('#set-form').addEventListener('input',e=>{
  const t=e.target,p=t.dataset&&t.dataset.s;if(!p)return;setPath(S.settings,p,readVal(t));queueSettingsSave();
});
$('#h-search').addEventListener('input',e=>{H.q=e.target.value;renderHistory();});
$('#c-search').addEventListener('input',e=>{C.q=e.target.value;renderCustomers();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else closePreview();}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('change',async e=>{if(!e.target||e.target.id!=='bk-file'||CLOUD)return;const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||o.app!=='bao-gia-hm'||!o.data)throw 0;
    if(!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện có trên thiết bị này bằng nội dung file. Tiếp tục?'))return;
    ['catalog','customers','quotes','settings'].forEach(c=>{lsSet('bgia:'+c,JSON.stringify(o.data[c]||{}));lsSet('bgia:seeded:'+c,'1');});lsDel('bgia:draft');location.reload();
  }catch(err){toast('File sao lưu không hợp lệ');}});
let profT=null;
document.addEventListener('input',e=>{const t=e.target;if(!CLOUD||!t||!t.dataset||!t.dataset.prof)return;
  PROFILE=Object.assign({},PROFILE,{[t.dataset.prof]:t.value});S.settings.seller=PROFILE.name||'';S.settings.phone=PROFILE.phone||'';refresh();
  clearTimeout(profT);profT=setTimeout(async()=>{try{await FB.setDoc(FB.doc(FB.db,'staff',ME.uid),{name:PROFILE.name||'',phone:PROFILE.phone||''},{merge:true});toast('Đã lưu');}catch(x){toast('Không lưu được, hãy thử lại');}},900);});
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));

/* ---------- start ---------- */
(async function start(){
  if(CLOUD)showAuth('load');
  Q=newQuote();
  try{const d=JSON.parse(lsGet('bgia:draft')||'null');if(d&&d._dirty){Q=Object.assign(newQuote(),d);Q.promos=Q.promos||[];Q.otherFees=Q.otherFees||[];}}catch(e){}
  fullRender();setView(location.hash.slice(1));renderHistory();renderCustomers();renderCatalog();renderSettings();updateSync();
  setTimeout(()=>{if(!Object.keys(S.loaded).every(k=>S.loaded[k])){S.timeout=true;updateSync();}},10000);
  await store.init();updateSync();renderBanner();
  if(CLOUD){if(!await cloudGate())return;if((Q._dirty||Q.id)&&Q._owner!==ME.uid){Q=newQuote();lsDel('bgia:draft');}S.settings.seller=PROFILE.name||'';S.settings.phone=PROFILE.phone||'';renderSettings();renderOwnerFilters();}
  ['catalog','customers','quotes','settings'].forEach(c=>store.watch(c,(l,m,e)=>onSnap(c,l,m,e)));
  if(CLOUD)store.watch('custom',(l,m,e)=>onSnap('custom',l,m,e));
  if(CLOUD&&ROLE==='admin')['staff','pending'].forEach(c=>store.watch(c,(l,m,e)=>onSnap(c,l,m,e)));
})();
})();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
